[project]
name = "privacy-router"
version = "0.1.0"
description = "Privacy Router — Core AI agent privacy layer"
authors = [
    { name = "devcomfort", email = "im@devcomfort.me" }
]
dependencies = [
    "litellm>=1.85.0",
    "instructor>=1.15.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1.0",
    "cryptography>=44.0.0",
    "pydantic>=2.0.0",
]
requires-python = ">= 3.13"

[project.optional-dependencies]
local-inference = [
    "transformers>=5.10.0",
    "huggingface-hub>=0.36.0",
]
privacy-detectors = [
    "presidio-analyzer>=2.2.358",
    "opf @ git+https://github.com/openai/privacy-filter.git@f7f00ca7fb869683eb732c010299d901457f19c3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.15",
    "pytest-cov>=7.1.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agents", "src/masker", "src/shared", "src/contracts", "src/config"]

[tool.pytest.ini_options]
testpaths = ["src/agents/tests", "src/agents/extractor/tests", "src/masker/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    '''ignore:There is no current event loop:DeprecationWarning:litellm\._service_logger''',
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "config"]
