# Multi-Engine Model Serving — Privacy Router
# =============================================================================
# Engines: vLLM, llama-server (llama.cpp), SGLang
# Target models: EXAONE 4.0 1.2B, Ministral 3B, Gemma4 E4B, Gemma4 E2B
#
# Usage:
#   # vLLM (GPU required):
#   docker compose -f docker-compose.yml -f docker-compose.engines.yml --profile vllm-exaone up -d
#   docker compose -f docker-compose.yml -f docker-compose.engines.yml --profile vllm-e4b up -d
#   docker compose -f docker-compose.yml -f docker-compose.engines.yml --profile vllm-e2b up -d
#   docker compose -f docker-compose.yml -f docker-compose.engines.yml --profile vllm-ministral up -d
#
#   # llama-server (CPU fallback, GPU optional):
#   docker compose -f docker-compose.yml -f docker-compose.engines.yml --profile llama-exaone up -d
#
#   # SGLang (GPU required):
#   docker compose -f docker-compose.yml -f docker-compose.engines.yml --profile sglang-e4b up -d
#
# Ports: vLLM=8000, llama=8002, SGLang=8003
#
# GGUF models are served from ./models/ directory (copy with cp -L to resolve symlinks)
# HF models are served from HF_CACHE (read-only mount)
# =============================================================================

x-gpu-common: &gpu-common
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  environment:
    NCCL_P2P_DISABLE: "1"
    HF_HUB_OFFLINE: "1"
  volumes:
    - ${HF_CACHE:-/home/donghyeon/.cache/huggingface}:/root/.cache/huggingface:ro
  networks:
    - backend

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # vLLM Engine (GPU, safetensors/HF models)
  # ═══════════════════════════════════════════════════════════════════════════

  vllm-exaone:
    image: vllm/vllm-openai:nightly
    profiles: [vllm-exaone]
    <<: *gpu-common
    ports: ["8000:8000"]
    command:
      - "--model"
      - "LGAI-EXAONE/EXAONE-4.0-1.2B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "auto"
      - "--gpu-memory-utilization"
      - "0.05"
      - "--max-model-len"
      - "4096"
      - "--trust-remote-code"
      - "--enforce-eager"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  vllm-e4b:
    image: vllm/vllm-openai:nightly
    profiles: [vllm-e4b]
    <<: *gpu-common
    ports: ["8000:8000"]
    command:
      - "--model"
      - "google/gemma-4-E4B-it"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "bfloat16"
      - "--gpu-memory-utilization"
      - "0.15"
      - "--max-model-len"
      - "8192"
      - "--trust-remote-code"
      - "--enforce-eager"
      - "--limit-mm-per-prompt"
      - '{"image":0,"audio":0}'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  vllm-e2b:
    image: vllm/vllm-openai:nightly
    profiles: [vllm-e2b]
    <<: *gpu-common
    ports: ["8000:8000"]
    command:
      - "--model"
      - "google/gemma-4-E2B-it"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "bfloat16"
      - "--gpu-memory-utilization"
      - "0.20"
      - "--max-model-len"
      - "8192"
      - "--trust-remote-code"
      - "--enforce-eager"
      - "--limit-mm-per-prompt"
      - '{"image":0,"audio":0}'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  vllm-ministral:
    image: vllm/vllm-openai:nightly
    profiles: [vllm-ministral]
    <<: *gpu-common
    ports: ["8000:8000"]
    command:
      - "--model"
      - "mistralai/Ministral-3-3B-Instruct-2512"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "bfloat16"
      - "--gpu-memory-utilization"
      - "0.10"
      - "--max-model-len"
      - "8192"
      - "--trust-remote-code"
      - "--enforce-eager"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # llama.cpp Engine (CPU/GPU, GGUF models from ./models/)
  # ═══════════════════════════════════════════════════════════════════════════

  llama-exaone:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: [llama-exaone]
    ports: ["8002:8000"]
    volumes:
      - ${PWD:-.}/models:/models:ro
    environment:
      HF_HUB_OFFLINE: "1"
    entrypoint: ["/app/llama-server"]
    command:
      - "--model"
      - "/models/EXAONE-4.0-1.2B-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--ctx-size"
      - "4096"
      - "--n-gpu-layers"
      - "99"
      - "--threads"
      - "4"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # SGLang Engine (GPU, HF models)
  # ═══════════════════════════════════════════════════════════════════════════

  sglang-e4b:
    image: lmsysorg/sglang:latest
    profiles: [sglang-e4b]
    <<: *gpu-common
    ports: ["8003:30000"]
    command:
      - "--model-path"
      - "google/gemma-4-E4B-it"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "30000"
      - "--dtype"
      - "bfloat16"
      - "--mem-fraction-static"
      - "0.15"
      - "--trust-remote-code"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  sglang-e2b:
    image: lmsysorg/sglang:latest
    profiles: [sglang-e2b]
    <<: *gpu-common
    ports: ["8003:30000"]
    command:
      - "--model-path"
      - "google/gemma-4-E2B-it"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "30000"
      - "--dtype"
      - "bfloat16"
      - "--mem-fraction-static"
      - "0.10"
      - "--trust-remote-code"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  sglang-ministral:
    image: lmsysorg/sglang:latest
    profiles: [sglang-ministral]
    <<: *gpu-common
    ports: ["8003:30000"]
    command:
      - "--model-path"
      - "mistralai/Ministral-3-3B-Instruct-2512"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "30000"
      - "--dtype"
      - "bfloat16"
      - "--mem-fraction-static"
      - "0.10"
      - "--trust-remote-code"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  sglang-exaone:
    image: lmsysorg/sglang:latest
    profiles: [sglang-exaone]
    <<: *gpu-common
    ports: ["8003:30000"]
    command:
      - "--model-path"
      - "LGAI-EXAONE/EXAONE-4.0-1.2B"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "30000"
      - "--dtype"
      - "auto"
      - "--mem-fraction-static"
      - "0.05"
      - "--trust-remote-code"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
