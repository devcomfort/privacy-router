<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1120" width="1700" height="1120" font-family="Noto Sans CJK KR, Noto Sans KR, Arial, sans-serif">
  <rect width="1700" height="1120" fill="#F8FAFC"/>
  <defs>
    <marker id="arrow-default" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#555555"/>
    </marker>
    <marker id="arrow-c0" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#2563EB"/>
    </marker>
    <marker id="arrow-c1" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#059669"/>
    </marker>
    <marker id="arrow-c2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#EA580C"/>
    </marker>
    <marker id="arrow-c3" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#DC2626"/>
    </marker>
    <marker id="arrow-c4" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-c5" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#475569"/>
    </marker>
  </defs>
  <rect x="46.0" y="150.0" width="1033.0" height="815.0" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1" rx="8"/>
  <text x="54.0" y="166.0" font-size="13" fill="#999999" font-weight="bold">Your environment / local boundary · 내 환경 / 로컬 경계</text>
  <rect x="1221.0" y="323.5" width="378.0" height="431.5" fill="#FAF5FF" stroke="#C084FC" stroke-width="1" rx="8"/>
  <text x="1229.0" y="339.5" font-size="13" fill="#999999" font-weight="bold">External provider boundary · 외부 제공자 경계</text>
  <path d="M 340.0,255.0 L 655.0,255.0" stroke="#555555" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 1045.0,315.9 Q 1141.1,377.4 1255.0,381.6" stroke="#555555" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 850.0,326.0 L 850.0,500.0" stroke="#555555" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 1045.0,599.8 L 1255.0,637.3" stroke="#555555" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 1260.7,721.0 Q 1119.5,741.9 999.3,819.0" stroke="#555555" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 727.2,326.0 Q 553.0,392.0 408.8,510.0" stroke="#555555" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 305.0,630.0 L 305.0,755.0" stroke="#555555" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <rect x="80.0" y="206.0" width="260.0" height="98.0" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" rx="8"/>
  <text x="210.0" y="251.4" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Your agent or app</text>
  <text x="210.0" y="270.4" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">내 에이전트 또는 앱</text>
  <rect x="655.0" y="184.0" width="390.0" height="142.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" rx="8"/>
  <text x="850.0" y="241.9" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Privacy Router</text>
  <text x="850.0" y="260.9" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Local protection check / 로컬 보호 검사</text>
  <text x="850.0" y="279.9" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Extractor → Judge → Router</text>
  <rect x="1255.0" y="357.5" width="310.0" height="145.0" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" rx="8"/>
  <text x="1410.0" y="399.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">1. Safe / allow</text>
  <text x="1410.0" y="417.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">External LLM</text>
  <text x="1410.0" y="435.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">Raw prompt allowed</text>
  <text x="1410.0" y="453.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">외부 LLM · 원문 전달</text>
  <text x="1410.0" y="471.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">응답을 앱으로 반환</text>
  <rect x="655.0" y="500.0" width="390.0" height="130.0" fill="#FFEDD5" stroke="#EA580C" stroke-width="2" rx="8"/>
  <text x="850.0" y="543.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">2. Sensitive but maskable</text>
  <text x="850.0" y="561.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">selective_mask</text>
  <text x="850.0" y="579.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">Replace sensitive spans with placeholders</text>
  <text x="850.0" y="597.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">민감 항목을 placeholder로 치환</text>
  <rect x="1255.0" y="609.0" width="310.0" height="112.0" fill="#F3E8FF" stroke="#7E22CE" stroke-width="2" rx="8"/>
  <text x="1410.0" y="652.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">External LLM</text>
  <text x="1410.0" y="670.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">Masked prompt only</text>
  <text x="1410.0" y="688.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">외부 LLM · placeholder만 전달</text>
  <rect x="655.0" y="819.0" width="390.0" height="112.0" fill="#FFEDD5" stroke="#EA580C" stroke-width="2" rx="8"/>
  <text x="850.0" y="862.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">Hydrator</text>
  <text x="850.0" y="880.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">Restore values locally, then return</text>
  <text x="850.0" y="898.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">로컬에서 placeholder 복원 후 응답 전달</text>
  <rect x="140.0" y="510.0" width="330.0" height="120.0" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" rx="8"/>
  <text x="305.0" y="557.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">3. Essential or no safe span</text>
  <text x="305.0" y="575.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">block</text>
  <text x="305.0" y="593.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">민감·필수 또는 안전하게 분리 불가</text>
  <rect x="140.0" y="755.0" width="330.0" height="130.0" fill="#FCE7F3" stroke="#DB2777" stroke-width="2" rx="8"/>
  <text x="305.0" y="798.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">Local LLM</text>
  <text x="305.0" y="816.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">Raw prompt stays local</text>
  <text x="305.0" y="834.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">로컬 LLM · 원문 외부 전송 없음</text>
  <text x="305.0" y="852.6" font-size="16" fill="#333333" text-anchor="middle" font-weight="bold">응답을 앱으로 반환</text>
  <text x="850.0" y="42.0" font-size="26" fill="#0F172A" text-anchor="middle">What happens to your prompt? / 프롬프트는 어디로 가나요?</text>
  <text x="850.0" y="70.0" font-size="15" fill="#475569" text-anchor="middle">Privacy Router checks every prompt locally before any external LLM call. / 외부 LLM 호출 전에 로컬에서 모든 프롬프트를 검사합니다.</text>
  <text x="850.0" y="1082.0" font-size="16" fill="#B91C1C" text-anchor="middle">Policy guarantee / 정책 보장: Raw sensitive data never crosses the external boundary. / 민감 원문은 외부 경계를 넘지 않습니다.</text>
</svg>
