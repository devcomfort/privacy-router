# vLLM Local Model Server — Privacy Router
# =============================================================================
# Usage:
#   # Run the local decision and generation model:
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml \
#     --profile gemma4 up -d vllm-gemma4
#
#   # Stop:
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml \
#     --profile gemma4 down
#
# Notes:
#   - One Gemma 4 26B endpoint serves both local runtime roles.
#   - Host port 8011 avoids the common development ports 8000/8001.
#   - HuggingFace cache is writable so the first run can download the model.
#   - Models use text-only mode to avoid loading unused multimodal encoders.
# =============================================================================

services:
  # ── Local generation: Gemma 4 26B A4B (MoE, ~52 GB weights) ──────────────
  vllm-gemma4:
    image: vllm/vllm-openai:nightly
    profiles:
      - gemma4
    ports:
      - "8011:8000"
    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      NCCL_P2P_DISABLE: "1"
    command:
      - "--model"
      - "google/gemma-4-26B-A4B-it"
      - "--served-model-name"
      - "google/gemma-4-26b-local"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "bfloat16"
      - "--kv-cache-memory-bytes"
      - "4G"
      - "--gpu-memory-utilization"
      - "0.80"
      - "--max-model-len"
      - "16384"
      - "--trust-remote-code"
      - "--limit-mm-per-prompt"
      - '{"image":0,"audio":0}'
      - "--enforce-eager"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
