# Privacy Router runtime model catalog.
# Trust boundary: decision/local models are on-device; external is cloud-only.
models:
  - id: openai/LGAI-EXAONE/EXAONE-4.0-1.2B
    api_base: http://127.0.0.1:8010/v1
    location: local
    tier: small
    cost_per_1m_tokens: 0.0

  - id: openai/google/gemma-4-26b-local
    api_base: http://127.0.0.1:8011/v1
    location: local
    tier: middle
    cost_per_1m_tokens: 0.0

  - id: openrouter/google/gemma-4-26b-a4b-it
    location: external
    tier: middle
    cost_per_1m_tokens: 0.06

decision:
  model: openai/LGAI-EXAONE/EXAONE-4.0-1.2B
  config:
    temperature: 0.0
    max_tokens: 2048

local:
  model: openai/google/gemma-4-26b-local
  config:
    temperature: 0.7
    max_tokens: 512

external:
  model: openrouter/google/gemma-4-26b-a4b-it
  config:
    temperature: 0.7
    max_tokens: 512

profiles:
  default:
    description: EXAONE decision, local Gemma generation, OpenRouter Gemma generation
    decision:
      model: openai/LGAI-EXAONE/EXAONE-4.0-1.2B
    local:
      model: openai/google/gemma-4-26b-local
    external:
      model: openrouter/google/gemma-4-26b-a4b-it
