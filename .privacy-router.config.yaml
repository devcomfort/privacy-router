# Privacy Router runtime model catalog.
# Trust boundary: decision/local models are on-device; external is cloud-only.
models:
  - id: openai/google/gemma-4-26b-local
    api_base: http://127.0.0.1:8011/v1
    location: local
    tier: middle
    cost_per_1m_tokens: 0.0


  - id: ollama/qwen3:1.7b
    api_base: http://127.0.0.1:11434
    location: local
    tier: small
    cost_per_1m_tokens: 0.0

  - id: openrouter/google/gemma-4-26b-a4b-it
    location: external
    tier: middle
    cost_per_1m_tokens: 0.06



decision:
  model: openai/google/gemma-4-26b-local
  config:
    temperature: 0.0
    max_tokens: 2048

local:
  model: openai/google/gemma-4-26b-local
  config:
    temperature: 0.7
    max_tokens: 512

external:
  model: openrouter/google/gemma-4-26b-a4b-it
  config:
    temperature: 0.7
    max_tokens: 512

profiles:
  default:
    description: Local Gemma privacy analysis and generation, OpenRouter Gemma external generation
    decision:
      model: openai/google/gemma-4-26b-local
    local:
      model: openai/google/gemma-4-26b-local
    external:
      model: openrouter/google/gemma-4-26b-a4b-it

  local-demo:
    description: Local Ollama demo profile for the bundled HTMX surface
    decision:
      model: ollama/qwen3:1.7b
      api_base: http://127.0.0.1:11434
    local:
      model: ollama/qwen3:1.7b
      api_base: http://127.0.0.1:11434
